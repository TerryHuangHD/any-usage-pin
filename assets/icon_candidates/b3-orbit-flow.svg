  <defs>
    <linearGradient id="tile" x1="248" y1="110" x2="738" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F6F7FD"/><stop offset="1" stop-color="#E3E6F2"/>
    </linearGradient>
    <linearGradient id="ink" x1="424" y1="360" x2="595" y2="672" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45608F"/><stop offset="1" stop-color="#192D55"/>
    </linearGradient>
    <linearGradient id="topRight" x1="512" y1="266" x2="758" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4387FA"/><stop offset="1" stop-color="#45BED2"/>
    </linearGradient>
    <linearGradient id="bottomRight" x1="758" y1="512" x2="512" y2="758" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45BED2"/><stop offset="1" stop-color="#9272E1"/>
    </linearGradient>
    <linearGradient id="bottomLeft" x1="512" y1="758" x2="266" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9272E1"/><stop offset="1" stop-color="#F0AD79"/>
    </linearGradient>
    <linearGradient id="topLeft" x1="266" y1="512" x2="512" y2="266" gradientUnits="userSpaceOnUse">
