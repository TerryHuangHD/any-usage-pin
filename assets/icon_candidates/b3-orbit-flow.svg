    <filter id="tileShadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#24324D" flood-opacity=".20"/>
    </filter>
    <filter id="ringShadow" x="168" y="168" width="688" height="688" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#53608A" flood-opacity=".17"/>
    </filter>
  </defs>
  <g filter="url(#tileShadow)">
