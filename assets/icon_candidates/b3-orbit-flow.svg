  <path transform="translate(-61.44 -61.44) scale(1.12)" d="M444 365H580C597.7 365 612 379.3 612 397C612 414.7 597.7 429 580 429H567V497L608 540C620.9 553.5 611.3 576 592.6 576H535L527 650C525.1 668.1 498.9 668.1 497 650L489 576H431.4C412.7 576 403.1 553.5 416 540L457 497V429H444C426.3 429 412 414.7 412 397C412 379.3 426.3 365 444 365Z" fill="url(#ink)"/>
