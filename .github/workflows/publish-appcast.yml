name: Publish verified Sparkle appcast

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted publishing code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_appcast.py --repository TerryHuangHD/any-usage-pin --output build/pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified appcast
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
